name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (MSVC, app and tests)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache the drum kit samples
        uses: actions/cache@v4
        with:
          path: assets/sfz/afro-kit/vcsl
          key: vcsl-${{ hashFiles('assets/sfz/afro-kit/samples.json') }}

      # The build copies the kit next to the app, so the download below is ready to play.
      - name: Fetch the drum kit samples (CC0, Versilian Community Sample Library)
        run: python tools/python/fetch_assets.py

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: LiveBand-windows-x64
          path: out/build/windows-release/LiveBand_artefacts/Release/
          if-no-files-found: error

  linux:
    name: Linux (compile check and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libxi-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: The committed grooves match their generator
        run: |
          python3 tools/python/make_grooves.py
          git diff --exit-code -- assets/grooves

      - name: Cache the drum kit samples
        uses: actions/cache@v4
        with:
          path: assets/sfz/afro-kit/vcsl
          key: vcsl-${{ hashFiles('assets/sfz/afro-kit/samples.json') }}

      - name: Fetch the drum kit samples (CC0, Versilian Community Sample Library)
        run: python3 tools/python/fetch_assets.py

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Test
        run: ctest --preset linux-debug

      - name: Render the groove through the full kit
        run: >
          out/build/linux-debug/lb-render_artefacts/Debug/lb-render
          --style assets/grooves/afrobeats --kit assets/sfz/afro-kit/afro-kit.sfz
          --plan Verse:2,Chorus:2 --count-in --out afrobeats-check.wav

  evaluation:
    name: Pitch and onset accuracy on real singing (vocadito)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libxi-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the evaluation tools
        run: pip install -r tools/python/requirements.txt

      - name: Cache the vocadito dataset
        uses: actions/cache@v4
        with:
          path: testdata/external/vocadito
          key: vocadito-zenodo-5578807

      - name: Fetch the vocadito dataset
        run: python tools/python/fetch_vocadito.py

      - name: Build lb-analyze
        run: |
          cmake --preset linux-release -DLB_BUILD_TESTS=OFF
          cmake --build --preset linux-release --target lb-analyze

      - name: Pitch accuracy (fails below the Phase 1 target)
        run: >
          python tools/python/eval_pitch.py --check --json pitch.json
          --analyzer out/build/linux-release/lb-analyze_artefacts/Release/lb-analyze
          --vocadito testdata/external/vocadito

      - name: Onset accuracy (fails below the Phase 1 target)
        run: >
          python tools/python/eval_onsets.py --check --json onsets.json
          --analyzer out/build/linux-release/lb-analyze_artefacts/Release/lb-analyze
          --vocadito testdata/external/vocadito

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: "*.json"
